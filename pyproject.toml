[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "napview"
version = "0.1.0rc1"
description = "Real-time sleep scoring and analysis visualizer."
readme = "readme.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]

[project.scripts]
napview = "napview.napview:main"

[tool.setuptools]
packages = { find = { include = ["napview*"] } }

[tool.setuptools.package-data]
"napview" = [
    "templates/**",
    "static/**",
    "libs/**",
    "assets/**",
    "CONFIG_DEFAULTS.txt",
]
