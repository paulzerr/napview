name: Windows PyInstaller Firefox Push Smoke
run-name: >-
  ${{ github.event_name == 'push' && github.event.head_commit.message || github.event.inputs.change_summary || github.event_name }} | Windows PyInstaller Firefox Push Smoke | ${{ github.ref_name }}

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      change_summary:
        description: Descriptive run label when manually dispatching this workflow
        required: false
        default: manual dispatch

concurrency:
  group: windows-pyinstaller-firefox-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyinstaller-firefox-smoke:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    env:
      REPO_ROOT: ${{ github.workspace }}
      ARTIFACT_DIR: ${{ github.workspace }}\push-pyinstaller-firefox-artifacts
      SCREENSHOT_PATH: ${{ github.workspace }}/push-pyinstaller-firefox-artifacts/napview_after_2min.png

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare debug artifact directory
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:ARTIFACT_DIR | Out-Null
          Set-Content -Path (Join-Path $env:ARTIFACT_DIR "workflow_start.txt") -Value "$(Get-Date -Format o) workflow started" -Encoding utf8

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location -Path $env:REPO_ROOT
          python -m pip install --upgrade pip "setuptools<70.0.0"
          python -m pip install pyinstaller playwright
          python -m pip install .

      - name: Install Playwright Firefox
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location -Path $env:REPO_ROOT
          python -m playwright install firefox

      - name: Download NIDRA model files
        run: |
          $ErrorActionPreference = "Stop"
          $VerbosePreference = "Continue"
          Set-Location -Path $env:REPO_ROOT
          New-Item -ItemType Directory -Force -Path nidra\nidra\NIDRA\models | Out-Null
          $downloadLog = Join-Path $env:ARTIFACT_DIR "nidra_download.log"
          $downloads = @(
            @{ Uri = "https://huggingface.co/pzerr/NIDRA_models/resolve/main/ez6.onnx"; OutFile = "nidra\nidra\NIDRA\models\ez6.onnx" },
            @{ Uri = "https://huggingface.co/pzerr/NIDRA_models/resolve/main/ez6moe.onnx"; OutFile = "nidra\nidra\NIDRA\models\ez6moe.onnx" },
            @{ Uri = "https://huggingface.co/pzerr/NIDRA_models/resolve/main/u-sleep-nsrr-2024.onnx"; OutFile = "nidra\nidra\NIDRA\models\u-sleep-nsrr-2024.onnx" },
            @{ Uri = "https://huggingface.co/pzerr/NIDRA_models/resolve/main/u-sleep-nsrr-2024_eeg.onnx"; OutFile = "nidra\nidra\NIDRA\models\u-sleep-nsrr-2024_eeg.onnx" }
          )

          $index = 0
          foreach ($item in $downloads) {
            $index += 1
            $startTs = Get-Date
            $startLine = "$(Get-Date -Format o) download_start index=$index uri=$($item.Uri) out=$($item.OutFile)"
            $startLine | Tee-Object -FilePath $downloadLog -Append

            Invoke-WebRequest -Uri $item.Uri -OutFile $item.OutFile -TimeoutSec 600 -MaximumRedirection 5

            $fileInfo = Get-Item -Path $item.OutFile
            $hash = (Get-FileHash -Path $item.OutFile -Algorithm SHA256).Hash
            $seconds = [math]::Round(((Get-Date) - $startTs).TotalSeconds, 2)
            $doneLine = "$(Get-Date -Format o) download_done index=$index seconds=$seconds bytes=$($fileInfo.Length) sha256=$hash"
            $doneLine | Tee-Object -FilePath $downloadLog -Append
          }

      - name: Build PyInstaller package
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location -Path $env:REPO_ROOT
          if (Test-Path -Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path -Path dist) { Remove-Item -Recurse -Force dist }
          $specPath = Join-Path $env:REPO_ROOT "NAPVIEW.spec"
          $consoleSpecPath = Join-Path $env:REPO_ROOT "NAPVIEW.ci_console.spec"
          $specContent = Get-Content -Path $specPath -Raw
          if (-not $specContent.Contains("console=False")) {
            throw "Expected 'console=False' in NAPVIEW.spec for CI console override"
          }
          $consoleSpecContent = $specContent.Replace("console=False", "console=True")
          Set-Content -Path $consoleSpecPath -Value $consoleSpecContent -Encoding utf8
          Set-Content -Path (Join-Path $env:ARTIFACT_DIR "pyinstaller_build_mode.txt") -Value "CI override: console=True using NAPVIEW.ci_console.spec" -Encoding utf8
          python -m PyInstaller $consoleSpecPath
          if (Test-Path -Path (Join-Path $env:REPO_ROOT "build\NAPVIEW\warn-NAPVIEW.txt")) {
            Copy-Item -Path (Join-Path $env:REPO_ROOT "build\NAPVIEW\warn-NAPVIEW.txt") -Destination (Join-Path $env:ARTIFACT_DIR "warn-NAPVIEW.txt") -Force
          }
          if (Test-Path -Path (Join-Path $env:REPO_ROOT "build\NAPVIEW\xref-NAPVIEW.html")) {
            Copy-Item -Path (Join-Path $env:REPO_ROOT "build\NAPVIEW\xref-NAPVIEW.html") -Destination (Join-Path $env:ARTIFACT_DIR "xref-NAPVIEW.html") -Force
          }
          if (Test-Path -Path (Join-Path $env:REPO_ROOT "dist")) {
            Get-ChildItem -Path (Join-Path $env:REPO_ROOT "dist") -Recurse -Force |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize |
              Out-File -FilePath (Join-Path $env:ARTIFACT_DIR "dist_tree.txt") -Encoding utf8
          }

      - name: Run package, click Start napview, wait 2 minutes, screenshot
        run: |
          $ErrorActionPreference = "Stop"
          $VerbosePreference = "Continue"
          $DebugPreference = "Continue"
          $InformationPreference = "Continue"
          Set-Location -Path $env:REPO_ROOT
          New-Item -ItemType Directory -Force -Path $env:ARTIFACT_DIR | Out-Null

          $debugLogPath = Join-Path $env:ARTIFACT_DIR "runner_debug.log"
          $probeLogPath = Join-Path $env:ARTIFACT_DIR "probe_attempts.log"
          $transcriptPath = Join-Path $env:ARTIFACT_DIR "runner_transcript.log"
          $sourceStdoutPath = Join-Path $env:ARTIFACT_DIR "source_probe_stdout.log"
          $sourceStderrPath = Join-Path $env:ARTIFACT_DIR "source_probe_stderr.log"
          Start-Transcript -Path $transcriptPath -Force | Out-Null

          function Write-DebugLine {
            param([string]$Message)
            $line = "$(Get-Date -Format o) $Message"
            $line | Tee-Object -FilePath $debugLogPath -Append | Out-Null
          }

          function Get-ProcessOwnedListeningPorts {
            param([int]$ProcessId)
            $ports = @()
            try {
              $ports += @(Get-NetTCPConnection -State Listen -OwningProcess $ProcessId -ErrorAction Stop | Select-Object -ExpandProperty LocalPort)
            }
            catch {
              Write-DebugLine "Get-NetTCPConnection failed for PID ${ProcessId}: $($_.Exception.Message)"
            }

            try {
              $netstatRawPath = Join-Path $env:ARTIFACT_DIR "netstat_probe_latest.txt"
              netstat -ano | Tee-Object -FilePath $netstatRawPath | Out-Null
              foreach ($line in Get-Content -Path $netstatRawPath) {
                if ($line -match "^\s*TCP\s+\S+:(\d+)\s+\S+\s+LISTENING\s+$ProcessId\s*$") {
                  $ports += [int]$Matches[1]
                }
              }
            }
            catch {
              Write-DebugLine "netstat parse failed for PID ${ProcessId}: $($_.Exception.Message)"
            }

            return @($ports | Sort-Object -Unique)
          }

          function Wait-ForNapviewWebUi {
            param(
              [System.Diagnostics.Process]$Process,
              [string]$Label,
              [int]$TimeoutMinutes,
              [string[]]$TargetHosts,
              [string]$ProbeLogPath
            )

            $deadline = (Get-Date).AddMinutes($TimeoutMinutes)
            $attempt = 0

            while ((Get-Date) -lt $deadline) {
              $attempt += 1
              if ($Process.HasExited) {
                throw "$Label process exited early with code $($Process.ExitCode)"
              }

              $candidatePorts = New-Object System.Collections.Generic.List[int]
              foreach ($p in 8145..8205) {
                $candidatePorts.Add([int]$p)
              }
              foreach ($p in (Get-ProcessOwnedListeningPorts -ProcessId $Process.Id)) {
                if (-not $candidatePorts.Contains([int]$p)) {
                  $candidatePorts.Add([int]$p)
                }
              }

              $portList = @($candidatePorts | Sort-Object -Unique)
              $attemptHeader = "probe_label=$Label attempt=$attempt pid=$($Process.Id) candidate_ports=$($portList -join ',')"
              Write-DebugLine $attemptHeader
              Add-Content -Path $ProbeLogPath -Value "$(Get-Date -Format o) $attemptHeader"

              foreach ($port in $portList) {
                foreach ($targetHost in $TargetHosts) {
                  $uri = "http://${targetHost}:$port/"
                  try {
                    $response = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 1 -Proxy $null
                    $okLine = "probe_ok label=$Label uri=$uri status=$($response.StatusCode)"
                    Write-DebugLine $okLine
                    Add-Content -Path $ProbeLogPath -Value "$(Get-Date -Format o) $okLine"
                    if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 400) {
                      return $uri
                    }
                  }
                  catch {
                    $msg = $_.Exception.Message.Replace("`r", " ").Replace("`n", " ")
                    $failLine = "probe_fail label=$Label uri=$uri error=$msg"
                    Write-DebugLine $failLine
                    Add-Content -Path $ProbeLogPath -Value "$(Get-Date -Format o) $failLine"
                  }
                }
              }

              Start-Sleep -Seconds 2
            }

            throw "Timed out waiting for $Label web UI. Hosts tested: $($TargetHosts -join ', '). Ports tested: 8145-8205 + process-owned listening ports"
          }

          function Get-WindowDetailsForProcess {
            param([int]$ProcessId)

            if (-not ([System.Management.Automation.PSTypeName]"NapviewWin32Window").Type) {
              Add-Type -TypeDefinition @"
using System;
using System.Text;
using System.Runtime.InteropServices;

public static class NapviewWin32Window
{
    public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);

    [DllImport("user32.dll")]
    public static extern bool EnumWindows(EnumWindowsProc lpEnumFunc, IntPtr lParam);

    [DllImport("user32.dll")]
    public static extern int GetWindowText(IntPtr hWnd, StringBuilder lpString, int nMaxCount);

    [DllImport("user32.dll")]
    public static extern int GetClassName(IntPtr hWnd, StringBuilder lpClassName, int nMaxCount);

    [DllImport("user32.dll")]
    public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint lpdwProcessId);

    [DllImport("user32.dll")]
    public static extern bool IsWindowVisible(IntPtr hWnd);
}
"@
            }

            $results = New-Object System.Collections.Generic.List[object]
            $callback = [NapviewWin32Window+EnumWindowsProc]{
              param([IntPtr]$hWnd, [IntPtr]$lParam)

              $pid = [uint32]0
              [void][NapviewWin32Window]::GetWindowThreadProcessId($hWnd, [ref]$pid)
              if ($pid -eq [uint32]$ProcessId) {
                $titleBuilder = New-Object System.Text.StringBuilder 1024
                [void][NapviewWin32Window]::GetWindowText($hWnd, $titleBuilder, $titleBuilder.Capacity)
                $classBuilder = New-Object System.Text.StringBuilder 256
                [void][NapviewWin32Window]::GetClassName($hWnd, $classBuilder, $classBuilder.Capacity)
                $results.Add([pscustomobject]@{
                  handle = ("0x{0:X}" -f $hWnd.ToInt64())
                  title = $titleBuilder.ToString()
                  class_name = $classBuilder.ToString()
                  visible = [bool][NapviewWin32Window]::IsWindowVisible($hWnd)
                }) | Out-Null
              }

              return $true
            }

            [void][NapviewWin32Window]::EnumWindows($callback, [IntPtr]::Zero)
            return @($results)
          }

          function Capture-DesktopScreenshot {
            param([string]$OutputPath)
            try {
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
              if ($bounds.Width -le 0 -or $bounds.Height -le 0) {
                throw "Virtual screen has invalid bounds: $bounds"
              }
              $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $graphics.CopyFromScreen($bounds.Left, $bounds.Top, 0, 0, $bitmap.Size)
              $bitmap.Save($OutputPath, [System.Drawing.Imaging.ImageFormat]::Png)
              $graphics.Dispose()
              $bitmap.Dispose()
              Write-DebugLine "desktop_capture_saved=$OutputPath"
            }
            catch {
              Write-DebugLine "desktop_capture_failed=$($_.Exception.Message)"
            }
          }

          function Export-RelevantEventLogs {
            param(
              [datetime]$StartTime,
              [string]$JsonPath,
              [string]$TextPath
            )
            try {
              $providers = @("Application Error", "Windows Error Reporting", "SideBySide", ".NET Runtime")
              $events = Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = $StartTime } -ErrorAction Stop |
                Where-Object { $providers -contains $_.ProviderName } |
                Select-Object TimeCreated, Id, LevelDisplayName, ProviderName, Message
              if ($events) {
                $events | ConvertTo-Json -Depth 6 | Set-Content -Path $JsonPath -Encoding utf8
                $events | Format-List | Out-File -FilePath $TextPath -Encoding utf8
              }
              else {
                "[]" | Set-Content -Path $JsonPath -Encoding utf8
                Set-Content -Path $TextPath -Value "No matching Application log events found in selected window." -Encoding utf8
              }
            }
            catch {
              $msg = $_.Exception.Message.Replace("`r", " ").Replace("`n", " ")
              Write-DebugLine "event_log_export_failed=$msg"
            }
          }

          Get-ChildItem Env:* | Sort-Object Name | Out-File -FilePath (Join-Path $env:ARTIFACT_DIR "env_dump.txt") -Encoding utf8
          Write-DebugLine "pwd=$(Get-Location)"
          Write-DebugLine "python_version=$(python --version 2>&1)"
          Write-DebugLine "powershell_version=$($PSVersionTable.PSVersion)"
          Write-DebugLine "runner_os=$([Environment]::OSVersion.VersionString)"

          $distRoot = Join-Path $env:REPO_ROOT "dist"
          $rootExePath = Join-Path $distRoot "NAPVIEW.exe"
          $exeCandidates = @(Get-ChildItem -Path $distRoot -Filter "NAPVIEW.exe" -Recurse | Sort-Object -Property FullName)
          @($exeCandidates | Select-Object -ExpandProperty FullName) | Set-Content -Path (Join-Path $env:ARTIFACT_DIR "exe_candidates.txt") -Encoding utf8

          $nestedExe = $exeCandidates | Where-Object { $_.FullName -ne $rootExePath } | Select-Object -First 1
          if ($nestedExe) {
            $exePath = $nestedExe.FullName
          } else {
            $exePath = ($exeCandidates | Select-Object -First 1).FullName
          }
          if (-not $exePath) {
            throw "Could not find NAPVIEW.exe under dist"
          }
          Set-Content -Path (Join-Path $env:ARTIFACT_DIR "exe_path.txt") -Value $exePath -Encoding utf8

          $stdoutPath = Join-Path $env:ARTIFACT_DIR "napview_stdout.log"
          $stderrPath = Join-Path $env:ARTIFACT_DIR "napview_stderr.log"
          $targetHosts = @("127.0.0.1", "localhost", "[::1]")
          $sourceProc = $null

          $env:NAPVIEW_NO_AUTO_BROWSER = "1"
          Set-Content -Path (Join-Path $env:ARTIFACT_DIR "auto_browser_env_value.txt") -Value $env:NAPVIEW_NO_AUTO_BROWSER -Encoding utf8
          Write-DebugLine "Set NAPVIEW_NO_AUTO_BROWSER=$($env:NAPVIEW_NO_AUTO_BROWSER)"

          $sourceProbeStatus = "NOT_RUN"
          $sourceProbeError = ""
          $sourceUrl = $null
          try {
            $sourceProc = Start-Process -FilePath "python" -ArgumentList "-m", "napview.napview" -WorkingDirectory $env:REPO_ROOT -PassThru -RedirectStandardOutput $sourceStdoutPath -RedirectStandardError $sourceStderrPath
            Set-Content -Path (Join-Path $env:ARTIFACT_DIR "source_process_pid.txt") -Value "$($sourceProc.Id)" -Encoding utf8
            Write-DebugLine "Started source probe PID=$($sourceProc.Id)"
            $sourceUrl = Wait-ForNapviewWebUi -Process $sourceProc -Label "source_probe" -TimeoutMinutes 2 -TargetHosts $targetHosts -ProbeLogPath $probeLogPath
            Set-Content -Path (Join-Path $env:ARTIFACT_DIR "source_detected_url.txt") -Value $sourceUrl -Encoding utf8
            Write-DebugLine "source_probe_detected_url=$sourceUrl"
            $sourceProbeStatus = "PASS"
          }
          catch {
            $sourceProbeStatus = "FAIL"
            $sourceProbeError = [string]$_.Exception.Message
            $msg = $_.Exception.Message.Replace("`r", " ").Replace("`n", " ")
            Write-DebugLine "source_probe_exception=$msg"
            ($_ | Out-String) | Out-File -FilePath (Join-Path $env:ARTIFACT_DIR "source_probe_exception.txt") -Encoding utf8
          }
          finally {
            if ($sourceProc -and -not $sourceProc.HasExited) {
              Stop-Process -Id $sourceProc.Id -Force -ErrorAction SilentlyContinue
            }
          }

          $proc = $null
          $url = $null
          $runnerError = $null

          try {
            $proc = Start-Process -FilePath $exePath -WorkingDirectory (Split-Path -Path $exePath -Parent) -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
            Set-Content -Path (Join-Path $env:ARTIFACT_DIR "process_pid.txt") -Value "$($proc.Id)" -Encoding utf8
            Write-DebugLine "Started NAPVIEW PID=$($proc.Id)"

            $url = Wait-ForNapviewWebUi -Process $proc -Label "packaged_exe" -TimeoutMinutes 4 -TargetHosts $targetHosts -ProbeLogPath $probeLogPath

            Write-DebugLine "Detected URL: $url"
            Set-Content -Path (Join-Path $env:ARTIFACT_DIR "detected_url.txt") -Value $url -Encoding utf8
            $env:TEST_URL = $url

            $pythonPath = Join-Path $env:ARTIFACT_DIR "playwright_smoke.py"
            $pythonLines = @(
              'import os',
              'from pathlib import Path',
              '',
              'from playwright.sync_api import sync_playwright',
              'import json',
              '',
              'url = os.environ["TEST_URL"]',
              'screenshot_path = Path(os.environ["SCREENSHOT_PATH"])',
              'start_response_path = screenshot_path.parent / "start_response.json"',
              '',
              'with sync_playwright() as p:',
              '    browser = p.firefox.launch(headless=True)',
              '    page = browser.new_page(viewport={"width": 1366, "height": 768})',
              '    page.goto(url, wait_until="domcontentloaded", timeout=60000)',
              '    page.wait_for_selector("#startButton:not([disabled])", timeout=120000)',
              '    with page.expect_response(lambda r: r.url.endswith("/start") and r.request.method == "POST", timeout=120000) as start_response_info:',
              '        page.click("#startButton")',
              '    start_payload = start_response_info.value.json()',
              '    start_response_path.write_text(json.dumps(start_payload, indent=2), encoding="utf-8")',
              '    if start_payload.get("status") != "success":',
              '        raise RuntimeError(f"/start failed: {start_payload}")',
              '    page.wait_for_timeout(120000)',
              '    screenshot_path.parent.mkdir(parents=True, exist_ok=True)',
              '    page.screenshot(path=str(screenshot_path), full_page=True)',
              '    browser.close()'
            )
            Set-Content -Path $pythonPath -Value ($pythonLines -join "`n") -Encoding utf8
            python $pythonPath
          }
          catch {
            $runnerError = $_
            $msg = $_.Exception.Message.Replace("`r", " ").Replace("`n", " ")
            Write-DebugLine "run_exception=$msg"
            ($_ | Out-String) | Out-File -FilePath (Join-Path $env:ARTIFACT_DIR "run_exception.txt") -Encoding utf8
          }
          finally {
            Write-DebugLine "Collecting diagnostics in finally"
            try { tasklist /v | Out-File -FilePath (Join-Path $env:ARTIFACT_DIR "tasklist_v.txt") -Encoding utf8 } catch {}
            try { Get-Process | Sort-Object ProcessName | Format-Table -AutoSize Name, Id, CPU, WS, StartTime | Out-File -FilePath (Join-Path $env:ARTIFACT_DIR "process_snapshot.txt") -Encoding utf8 } catch {}
            try { netstat -ano | Out-File -FilePath (Join-Path $env:ARTIFACT_DIR "netstat_ano_final.txt") -Encoding utf8 } catch {}
            try {
              if ($proc) {
                $windowInfo = Get-WindowDetailsForProcess -ProcessId $proc.Id
                ($windowInfo | ConvertTo-Json -Depth 8) | Set-Content -Path (Join-Path $env:ARTIFACT_DIR "napview_windows.json") -Encoding utf8
                @($windowInfo | Select-Object -ExpandProperty title) | Set-Content -Path (Join-Path $env:ARTIFACT_DIR "napview_window_titles.txt") -Encoding utf8
              }
            } catch {}
            try {
              Export-RelevantEventLogs -StartTime (Get-Date).AddMinutes(-30) -JsonPath (Join-Path $env:ARTIFACT_DIR "windows_application_events.json") -TextPath (Join-Path $env:ARTIFACT_DIR "windows_application_events.txt")
            } catch {}
            if ($runnerError) {
              Capture-DesktopScreenshot -OutputPath (Join-Path $env:ARTIFACT_DIR "desktop_on_failure.png")
            }
            try {
              $appDataRoot = Join-Path $env:LOCALAPPDATA "napview"
              Get-ChildItem -Path $appDataRoot -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Out-File -FilePath (Join-Path $env:ARTIFACT_DIR "napview_localappdata_files.txt") -Encoding utf8
              Get-ChildItem -Path $appDataRoot -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -eq ".log" } | ForEach-Object {
                $safeName = $_.FullName.Replace(":", "").Replace("\\", "_")
                Copy-Item -Path $_.FullName -Destination (Join-Path $env:ARTIFACT_DIR "copied_log_$safeName") -Force -ErrorAction SilentlyContinue
              }
            } catch {}
            try {
              $crashDumpRoot = Join-Path $env:LOCALAPPDATA "CrashDumps"
              Get-ChildItem -Path $crashDumpRoot -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Out-File -FilePath (Join-Path $env:ARTIFACT_DIR "crash_dump_files.txt") -Encoding utf8
              Get-ChildItem -Path $crashDumpRoot -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -lt 20971520 } | ForEach-Object {
                Copy-Item -Path $_.FullName -Destination (Join-Path $env:ARTIFACT_DIR "copied_crashdump_$($_.Name)") -Force -ErrorAction SilentlyContinue
              }
            } catch {}

            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }

            $summary = [ordered]@{
              status = if ($runnerError) { "FAIL" } else { "PASS" }
              error = if ($runnerError) { [string]$runnerError.Exception.Message } else { "" }
              source_probe = [ordered]@{
                status = $sourceProbeStatus
                error = $sourceProbeError
                detected_url = $sourceUrl
                process_pid = if ($sourceProc) { $sourceProc.Id } else { $null }
              }
              packaged_probe = [ordered]@{
                detected_url = $url
                process_pid = if ($proc) { $proc.Id } else { $null }
              }
              exe_path = $exePath
              detected_url = $url
              process_pid = if ($proc) { $proc.Id } else { $null }
            }
            ($summary | ConvertTo-Json -Depth 8) | Set-Content -Path (Join-Path $env:ARTIFACT_DIR "run_summary.json") -Encoding utf8
            try { Stop-Transcript | Out-Null } catch {}
          }

          if ($runnerError) {
            throw $runnerError
          }

      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pyinstaller-firefox-push-debug
          path: ${{ github.workspace }}\push-pyinstaller-firefox-artifacts
          if-no-files-found: error
          retention-days: 7
