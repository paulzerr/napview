name: EXE Matrix Tester

on:
  workflow_dispatch:

jobs:
  exe-matrix:
    name: exe-matrix (${{ matrix.runner }}, ${{ matrix.browser }}, ${{ matrix.resolution }}, ${{ matrix.dll_mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-22.04
          - windows-latest
          - windows-2022
          - macos-15-intel
          - macos-14
        browser:
          - chromium
          - firefox
          - webkit
          - msedge
        resolution:
          - 1920x1080
          - 1280x720
          - 375x812
        dll_mode:
          - bundled
          - system
        exclude:
          - runner: ubuntu-latest
            browser: msedge
          - runner: ubuntu-22.04
            browser: msedge
          - runner: macos-15-intel
            browser: msedge
          - runner: macos-14
            browser: msedge

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install .
          pip install playwright

      - name: Install browser runtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install --with-deps "${{ matrix.browser }}"

      - name: Install browser runtime (non-Linux)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install "${{ matrix.browser }}"

      - name: Launch, screenshot, collect logs
        shell: bash
        env:
          MATRIX_RUNNER: ${{ matrix.runner }}
          MATRIX_BROWSER: ${{ matrix.browser }}
          MATRIX_RESOLUTION: ${{ matrix.resolution }}
          MATRIX_DLL_MODE: ${{ matrix.dll_mode }}
          RUNNER_OS: ${{ runner.os }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          runner = os.environ["MATRIX_RUNNER"]
          browser_name = os.environ["MATRIX_BROWSER"]
          resolution = os.environ["MATRIX_RESOLUTION"]
          dll_mode = os.environ["MATRIX_DLL_MODE"]
          runner_os = os.environ["RUNNER_OS"]
          width_str, height_str = resolution.split("x")
          width = int(width_str)
          height = int(height_str)

          root = Path("matrix-run")
          logs_dir = root / "logs"
          shots_dir = root / "screenshots"
          root.mkdir(exist_ok=True)
          logs_dir.mkdir(exist_ok=True)
          shots_dir.mkdir(exist_ok=True)

          server_log_path = logs_dir / "napview_server.log"
          runner_log_path = logs_dir / "runner.log"
          metadata_path = root / "metadata.json"
          screenshot_path = shots_dir / f"{runner}__{browser_name}__{resolution}__{dll_mode}.png"

          start_cmd = [sys.executable, "-m", "napview.napview"]
          if dll_mode == "system":
              start_cmd = [sys.executable, "-m", "napview.napview_backend"]

          metadata = {
              "runner": runner,
              "runner_os": runner_os,
              "browser": browser_name,
              "resolution": resolution,
              "dll_mode": dll_mode,
              "start_cmd": start_cmd,
              "status": "UNKNOWN",
              "url": "",
              "error": "",
          }

          proc = None
          log_file = None
          try:
              log_file = server_log_path.open("w", encoding="utf-8")
              proc = subprocess.Popen(
                  start_cmd,
                  stdout=log_file,
                  stderr=subprocess.STDOUT,
                  text=True,
              )

              deadline = time.time() + 180
              url = ""
              while time.time() < deadline:
                  if proc.poll() is not None:
                      raise RuntimeError(f"napview exited early with code {proc.returncode}")
                  if server_log_path.exists():
                      text = server_log_path.read_text(encoding="utf-8", errors="replace")
                      match = re.search(r"Server started at (http://localhost:\d+)", text)
                      if match:
                          url = match.group(1)
                          break
                  for port in range(8145, 8205):
                      probe_url = f"http://127.0.0.1:{port}"
                      try:
                          with urllib.request.urlopen(probe_url, timeout=1) as response:
                              if response.status < 500:
                                  url = probe_url
                                  break
                      except (urllib.error.URLError, TimeoutError):
                          continue
                  if url:
                      break
                  time.sleep(1)

              if not url:
                  raise RuntimeError("Timed out waiting for server URL in logs")

              metadata["url"] = url

              with sync_playwright() as p:
                  if browser_name == "chromium":
                      browser = p.chromium.launch(headless=True)
                  elif browser_name == "firefox":
                      browser = p.firefox.launch(headless=True)
                  elif browser_name == "webkit":
                      browser = p.webkit.launch(headless=True)
                  elif browser_name == "msedge":
                      browser = p.chromium.launch(
                          channel="msedge",
                          headless=True,
                          args=["--no-first-run", "--no-default-browser-check"],
                      )
                  else:
                      raise RuntimeError(f"Unsupported browser {browser_name}")

                  page = browser.new_page(viewport={"width": width, "height": height})
                  page.goto(url, wait_until="domcontentloaded", timeout=45000)
                  page.wait_for_timeout(1500)
                  page.screenshot(path=str(screenshot_path), full_page=True)
                  browser.close()

              metadata["status"] = "PASS"
          except Exception as exc:
              metadata["status"] = "FAIL"
              metadata["error"] = str(exc)
              raise
          finally:
              if log_file is not None:
                  log_file.flush()
                  log_file.close()
              if proc is not None and proc.poll() is None:
                  proc.terminate()
                  try:
                      proc.wait(timeout=20)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                      proc.wait(timeout=20)
              runner_log_path.write_text(
                  "\n".join(
                      [
                          f"runner={runner}",
                          f"runner_os={runner_os}",
                          f"browser={browser_name}",
                          f"resolution={resolution}",
                          f"dll_mode={dll_mode}",
                          f"status={metadata['status']}",
                          f"url={metadata.get('url', '')}",
                          f"error={metadata.get('error', '')}",
                      ]
                  )
                  + "\n",
                  encoding="utf-8",
              )
              metadata_path.write_text(json.dumps(metadata, indent=2), encoding="utf-8")
          PY

      - name: Upload matrix cell artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exe-matrix-${{ matrix.runner }}-${{ matrix.browser }}-${{ matrix.resolution }}-${{ matrix.dll_mode }}
          path: matrix-run
          if-no-files-found: warn
          retention-days: 3

  aggregate:
    name: aggregate
    if: always()
    needs: exe-matrix
    runs-on: ubuntu-latest

    steps:
      - name: Download matrix artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: exe-matrix-*
          path: matrix-collected
          merge-multiple: false

      - name: Build consolidated bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          collected = Path("matrix-collected")
          output = Path("matrix-final")
          output.mkdir(exist_ok=True)
          (output / "screenshots").mkdir(exist_ok=True)
          (output / "logs").mkdir(exist_ok=True)

          rows = []
          artifact_dirs = sorted([p for p in collected.iterdir() if p.is_dir()]) if collected.exists() else []
          for artifact_dir in artifact_dirs:
              metadata_file = artifact_dir / "metadata.json"
              if not metadata_file.exists():
                  continue
              data = json.loads(metadata_file.read_text(encoding="utf-8"))
              rows.append(data)

              for shot in (artifact_dir / "screenshots").glob("*.png"):
                  target = output / "screenshots" / f"{artifact_dir.name}__{shot.name}"
                  target.write_bytes(shot.read_bytes())
              for log_file in (artifact_dir / "logs").glob("*"):
                  target = output / "logs" / f"{artifact_dir.name}__{log_file.name}"
                  target.write_bytes(log_file.read_bytes())

          rows.sort(
              key=lambda r: (
                  r.get("runner", ""),
                  r.get("browser", ""),
                  r.get("resolution", ""),
                  r.get("dll_mode", ""),
              )
          )

          csv_path = output / "matrix_summary.csv"
          with csv_path.open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=["runner", "runner_os", "browser", "resolution", "dll_mode", "status", "url", "error"],
              )
              writer.writeheader()
              for row in rows:
                  writer.writerow(
                      {
                          "runner": row.get("runner", ""),
                          "runner_os": row.get("runner_os", ""),
                          "browser": row.get("browser", ""),
                          "resolution": row.get("resolution", ""),
                          "dll_mode": row.get("dll_mode", ""),
                          "status": row.get("status", ""),
                          "url": row.get("url", ""),
                          "error": row.get("error", ""),
                      }
                  )

          pass_count = sum(1 for r in rows if r.get("status") == "PASS")
          fail_count = sum(1 for r in rows if r.get("status") != "PASS")
          md_lines = [
              "# EXE Matrix Summary",
              "",
              f"Total cells: {len(rows)}",
              f"Pass: {pass_count}",
              f"Fail: {fail_count}",
              "",
              "| runner | browser | resolution | dll_mode | status |",
              "|---|---|---|---|---|",
          ]
          for row in rows:
              md_lines.append(
                  f"| {row.get('runner', '')} | {row.get('browser', '')} | {row.get('resolution', '')} | {row.get('dll_mode', '')} | {row.get('status', '')} |"
              )
          (output / "matrix_summary.md").write_text("\n".join(md_lines) + "\n", encoding="utf-8")
          PY

          cd matrix-final
          zip -rq exe-matrix-bundle.zip screenshots logs matrix_summary.csv matrix_summary.md

      - name: Upload combined matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-matrix-bundle
          path: matrix-final/exe-matrix-bundle.zip
          retention-days: 7
