name: Windows Installer Debug

on:
  workflow_dispatch:

jobs:
  windows-installer-debug:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    env:
      REPO_ROOT: ${{ github.workspace }}
      ARTIFACT_DIR: ${{ github.workspace }}\installer-debug-artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          Set-Location -Path $env:REPO_ROOT
          python -m pip install --upgrade pip "setuptools<70.0.0"
          python -m pip install pyinstaller playwright
          python -m pip install .

      - name: Install Playwright browser
        run: |
          Set-Location -Path $env:REPO_ROOT
          python -m playwright install chromium

      - name: Ensure NIDRA model files
        run: |
          Set-Location -Path $env:REPO_ROOT
          New-Item -ItemType Directory -Force -Path nidra\nidra\NIDRA\models | Out-Null
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/ez6.onnx -OutFile nidra\nidra\NIDRA\models\ez6.onnx
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/ez6moe.onnx -OutFile nidra\nidra\NIDRA\models\ez6moe.onnx
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/u-sleep-nsrr-2024.onnx -OutFile nidra\nidra\NIDRA\models\u-sleep-nsrr-2024.onnx
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/u-sleep-nsrr-2024_eeg.onnx -OutFile nidra\nidra\NIDRA\models\u-sleep-nsrr-2024_eeg.onnx

      - name: Build executable with PyInstaller
        run: |
          Set-Location -Path $env:REPO_ROOT
          if (Test-Path -Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path -Path dist) { Remove-Item -Recurse -Force dist }
          python -m PyInstaller NAPVIEW.spec

      - name: Run built installer and exercise GUI
        run: |
          Set-Location -Path $env:REPO_ROOT
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:ARTIFACT_DIR | Out-Null

          $transcriptPath = Join-Path $env:ARTIFACT_DIR "runner_transcript.log"
          Start-Transcript -Path $transcriptPath -Force | Out-Null

          $runnerError = $null
          $proc = $null
          $url = $null
          $dataRoots = New-Object System.Collections.Generic.List[string]
          $browserRegex = '^(chrome|msedge|firefox|iexplore|brave|opera)\.exe$'

          function Write-JsonFile {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][object]$Value
            )
            $json = $Value | ConvertTo-Json -Depth 8
            Set-Content -Path $Path -Value $json -Encoding utf8
          }

          function Get-BrowserProcessSnapshot {
            $items = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match $browserRegex } |
              Select-Object Name, ProcessId, ParentProcessId, CreationDate, CommandLine
            if ($items) { return @($items) }
            return @()
          }

          Remove-Item Env:NAPVIEW_NO_AUTO_BROWSER -ErrorAction SilentlyContinue
          Set-Content -Path (Join-Path $env:ARTIFACT_DIR "auto_browser_env_value.txt") -Value "<unset>" -Encoding utf8

          $browserBefore = Get-BrowserProcessSnapshot
          Write-JsonFile -Path (Join-Path $env:ARTIFACT_DIR "browser_processes_before.json") -Value $browserBefore

          $browserCheck = $null

          try {
            $distTreePath = Join-Path $env:ARTIFACT_DIR "dist_tree.txt"
            Get-ChildItem -Path (Join-Path $env:REPO_ROOT "dist") -Recurse -Force | Format-Table -AutoSize | Out-File -FilePath $distTreePath -Encoding utf8

            $foundExe = Get-ChildItem -Path (Join-Path $env:REPO_ROOT "dist\NAPVIEW") -Filter "NAPVIEW.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $foundExe) { throw "Built executable not found under dist\\NAPVIEW" }
            $exePath = $foundExe.FullName
            Set-Content -Path (Join-Path $env:ARTIFACT_DIR "exe_path.txt") -Value $exePath -Encoding utf8

            $stdoutPath = Join-Path $env:ARTIFACT_DIR "napview_stdout.log"
            $stderrPath = Join-Path $env:ARTIFACT_DIR "napview_stderr.log"
            $proc = Start-Process -FilePath $exePath -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
            Set-Content -Path (Join-Path $env:ARTIFACT_DIR "process_pid.txt") -Value "$($proc.Id)" -Encoding utf8

            $url = $null
            $deadline = (Get-Date).AddMinutes(4)
            while ((Get-Date) -lt $deadline -and -not $url) {
              if ($proc.HasExited) {
                throw "NAPVIEW process exited early with code $($proc.ExitCode)"
              }
              foreach ($port in 8145..8205) {
                try {
                  $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port" -UseBasicParsing -TimeoutSec 2
                  if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 400) {
                    $url = "http://127.0.0.1:$port/"
                    break
                  }
                } catch {}
              }
              if (-not $url) { Start-Sleep -Seconds 2 }
            }
            if (-not $url) {
              throw "Timed out waiting for Napview GUI URL on localhost ports 8145-8205"
            }

            Set-Content -Path (Join-Path $env:ARTIFACT_DIR "detected_url.txt") -Value $url -Encoding utf8

            try {
              $configResponse = Invoke-WebRequest -Uri "${url}load_config" -UseBasicParsing -TimeoutSec 15
              Set-Content -Path (Join-Path $env:ARTIFACT_DIR "load_config_response.json") -Value $configResponse.Content -Encoding utf8
              $configJson = $configResponse.Content | ConvertFrom-Json
              if ($configJson.base_path) {
                $dataRoots.Add([string]$configJson.base_path)
                Set-Content -Path (Join-Path $env:ARTIFACT_DIR "detected_base_path.txt") -Value ([string]$configJson.base_path) -Encoding utf8
              }
              if ($configJson.log_file_name) {
                Set-Content -Path (Join-Path $env:ARTIFACT_DIR "detected_log_file_name.txt") -Value ([string]$configJson.log_file_name) -Encoding utf8
              }
            }
            catch {
              ($_ | Out-String) | Out-File -FilePath (Join-Path $env:ARTIFACT_DIR "load_config_error.txt") -Encoding utf8
            }

            $browserAfterNapviewStart = Get-BrowserProcessSnapshot
            Write-JsonFile -Path (Join-Path $env:ARTIFACT_DIR "browser_processes_after_napview_start.json") -Value $browserAfterNapviewStart
            $beforeByPid = @{}
            foreach ($item in $browserBefore) {
              $beforeByPid["$($item.ProcessId)"] = $true
            }
            $newBrowserAfterNapviewStart = @($browserAfterNapviewStart | Where-Object { -not $beforeByPid.ContainsKey("$($_.ProcessId)") })
            $browserCheck = [ordered]@{
              phase = "after_napview_start_before_playwright"
              auto_browser_disabled = $false
              detected_url = $url
              before_count = @($browserBefore).Count
              after_count = @($browserAfterNapviewStart).Count
              new_browser_process_count = @($newBrowserAfterNapviewStart).Count
              new_browser_processes = $newBrowserAfterNapviewStart
            }
            Write-JsonFile -Path (Join-Path $env:ARTIFACT_DIR "browser_open_check.json") -Value $browserCheck

            $env:TEST_URL = $url
            $env:SCREENSHOT_PATH = (Join-Path $env:ARTIFACT_DIR "gui_after_start.png")
            $env:START_RESPONSE_PATH = (Join-Path $env:ARTIFACT_DIR "start_response.json")

            $py = @'
            import json
            import os
            from pathlib import Path

            from playwright.sync_api import sync_playwright

            url = os.environ["TEST_URL"]
            screenshot_path = Path(os.environ["SCREENSHOT_PATH"])
            start_response_path = Path(os.environ["START_RESPONSE_PATH"])

            with sync_playwright() as p:
                browser = p.chromium.launch(
                    headless=True,
                    args=["--no-first-run", "--no-default-browser-check"],
                )
                page = browser.new_page(viewport={"width": 1280, "height": 720})
                try:
                    response = page.goto(url, wait_until="domcontentloaded", timeout=60000)
                    if response is None:
                        raise RuntimeError("Initial page load returned no response")
                    page.wait_for_timeout(5000)
                    page.wait_for_selector("#startButton:not([disabled])", timeout=60000)
                    with page.expect_response(
                        lambda r: r.url.endswith("/start") and r.request.method == "POST",
                        timeout=120000,
                    ) as start_response_info:
                        page.click("#startButton")
                    payload = start_response_info.value.json()
                    start_response_path.write_text(json.dumps(payload, indent=2), encoding="utf-8")
                    if payload.get("status") != "success":
                        raise RuntimeError(f"START failed: {payload}")
                    page.wait_for_timeout(120000)
                finally:
                    screenshot_path.parent.mkdir(parents=True, exist_ok=True)
                    page.screenshot(path=str(screenshot_path), full_page=True)
                    browser.close()
          '@
            $py = $py -replace '(?m)^ {2}', ''
            $py | python -
          }
          catch {
            $runnerError = $_
            ($_ | Out-String) | Out-File -FilePath (Join-Path $env:ARTIFACT_DIR "run_exception.txt") -Encoding utf8
          }
          finally {
            $browserAfter = Get-BrowserProcessSnapshot
            Write-JsonFile -Path (Join-Path $env:ARTIFACT_DIR "browser_processes_after.json") -Value $browserAfter

            if (-not $browserCheck) {
              $beforeByPid = @{}
              foreach ($item in $browserBefore) {
                $beforeByPid["$($item.ProcessId)"] = $true
              }
              $newBrowserProcesses = @($browserAfter | Where-Object { -not $beforeByPid.ContainsKey("$($_.ProcessId)") })
              Write-JsonFile -Path (Join-Path $env:ARTIFACT_DIR "browser_open_check.json") -Value ([ordered]@{
                phase = "fallback_finally"
                auto_browser_disabled = $false
                detected_url = $url
                before_count = @($browserBefore).Count
                after_count = @($browserAfter).Count
                new_browser_process_count = @($newBrowserProcesses).Count
                new_browser_processes = $newBrowserProcesses
              })
            }

            try {
              netstat -ano | Out-File -FilePath (Join-Path $env:ARTIFACT_DIR "netstat_ano.txt") -Encoding utf8
            } catch {}

            Start-Sleep -Seconds 2
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            Get-Process -Name "NAPVIEW" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

            $defaultDataRoot = Join-Path $env:LOCALAPPDATA "napview\data"
            if (Test-Path -Path $defaultDataRoot) { $dataRoots.Add($defaultDataRoot) }
            $roamingDataRoot = Join-Path $env:APPDATA "napview\data"
            if (Test-Path -Path $roamingDataRoot) { $dataRoots.Add($roamingDataRoot) }

            $uniqueDataRoots = @($dataRoots | Where-Object { $_ } | Sort-Object -Unique)
            $copiedDataRoots = @()
            foreach ($sourceRoot in $uniqueDataRoots) {
              if (Test-Path -Path $sourceRoot) {
                $safeName = ($sourceRoot -replace '[:\\\/ ]', '_').Trim('_')
                $destRoot = Join-Path $env:ARTIFACT_DIR "napview-data-$safeName"
                Copy-Item -Path $sourceRoot -Destination $destRoot -Recurse -Force -ErrorAction SilentlyContinue
                $copiedDataRoots += $destRoot
              }
            }

            $scanPath = Join-Path $env:ARTIFACT_DIR "prediction_scan.txt"
            $copiedLogFiles = @()
            foreach ($copiedRoot in $copiedDataRoots) {
              $copiedLogFiles += Get-ChildItem -Path $copiedRoot -Recurse -Filter "*.log" -ErrorAction SilentlyContinue
            }
            if (@($copiedLogFiles).Count -gt 0) {
              $hits = Select-String -Path ($copiedLogFiles.FullName) -Pattern "prediction successful" -SimpleMatch -CaseSensitive:$false -ErrorAction SilentlyContinue
              if ($hits) {
                $hits | ForEach-Object { "$($_.Path):$($_.LineNumber):$($_.Line)" } | Out-File -FilePath $scanPath -Encoding utf8
              } else {
                Set-Content -Path $scanPath -Value "No 'prediction successful' entries found in copied log files." -Encoding utf8
              }
            } else {
              Set-Content -Path $scanPath -Value "No copied napview log files were found." -Encoding utf8
            }

            Write-JsonFile -Path (Join-Path $env:ARTIFACT_DIR "run_summary.json") -Value ([ordered]@{
              status = if ($runnerError) { "FAIL" } else { "PASS" }
              error = if ($runnerError) { [string]$runnerError.Exception.Message } else { "" }
              detected_url = $url
              process_pid = if ($proc) { $proc.Id } else { $null }
              copied_data_roots = $uniqueDataRoots
              copied_artifact_dirs = $copiedDataRoots
            })

            try {
              Stop-Transcript | Out-Null
            } catch {}
          }

          if ($runnerError) {
            throw $runnerError
          }

      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-debug
          path: ${{ github.workspace }}\installer-debug-artifacts
          if-no-files-found: warn
          retention-days: 7
