name: NAPVIEW Release/Rehearsal

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      mode:
        description: Workflow mode
        required: true
        default: rehearsal
        type: choice
        options:
          - rehearsal
          - release
      publish_testpypi:
        description: Publish package to TestPyPI
        required: true
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'
      testpypi_version:
        description: Base prerelease version for TestPyPI (0.1.1 or 0.1.1rc1)
        required: true
        default: 0.1.1rc1
        type: string
      python_runtime_version:
        description: CPython NuGet runtime version for standalone ZIP build
        required: false
        default: 3.11.9
        type: string

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 999
    defaults:
      run:
        shell: powershell
    env:
      REPO_ROOT: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache Python venv
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: venv
          key: ${{ runner.os }}-venv-v1${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Setup Python environment and install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          .\venv\Scripts\activate
          python -m pip install --upgrade pip "setuptools<70.0.0" wheel
          pip install pyinstaller toml
          pip install .

      - name: Cache NIDRA models
        uses: actions/cache@v4
        id: cache-nidra-models
        with:
          path: nidra/nidra/NIDRA/models
          key: ${{ runner.os }}-nidra-models-v1

      - name: Download NIDRA models
        if: steps.cache-nidra-models.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path nidra/nidra/NIDRA/models
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/ez6.onnx -OutFile nidra/nidra/NIDRA/models/ez6.onnx
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/ez6moe.onnx -OutFile nidra/nidra/NIDRA/models/ez6moe.onnx
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/u-sleep-nsrr-2024.onnx -OutFile nidra/nidra/NIDRA/models/u-sleep-nsrr-2024.onnx
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/u-sleep-nsrr-2024_eeg.onnx -OutFile nidra/nidra/NIDRA/models/u-sleep-nsrr-2024_eeg.onnx

      - name: Enforce setuptools version
        run: |
          .\venv\Scripts\activate
          python -m pip install "setuptools<70.0.0"

      - name: Build executable with PyInstaller
        run: .\venv\Scripts\python -m PyInstaller NAPVIEW.spec

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create self-extracting installer
        run: |
          @"
          ;!@Install@!UTF-8!
          Title="NAPVIEW Installer"
          BeginPrompt="This will install NAPVIEW. Do you want to continue?"
          Progress="yes"
          FinishMessage="Do you want to launch NAPVIEW now?"
          RunProgram="NAPVIEW\NAPVIEW.exe"
          ;!@InstallEnd@!
          "@ | Set-Content -Path sfx_config.txt
          Set-Location -Path dist
          & "C:\Program Files\7-Zip\7z.exe" a ..\NAPVIEW_archive.7z NAPVIEW
          Set-Location -Path ..
          cmd.exe --% /c copy /b "C:\Program Files\7-Zip\7z.sfx" + sfx_config.txt + NAPVIEW_archive.7z NAPVIEW_installer.exe

      - name: Build standalone ZIP
        run: |
          Set-Location -Path $env:REPO_ROOT
          $pythonVersion = "${{ github.event_name == 'workflow_dispatch' && inputs.python_runtime_version || '3.11.9' }}"
          if ([string]::IsNullOrWhiteSpace($pythonVersion)) { $pythonVersion = "3.11.9" }
          .\.github\workflows\build_portable_winows_zip.ps1 -RepoRoot $env:REPO_ROOT -PythonVersion $pythonVersion

      - name: Prepare standalone release filename
        run: |
          Copy-Item -LiteralPath "$env:REPO_ROOT\dist\NAPVIEW_portable_win64.zip" -Destination "$env:REPO_ROOT\NAPVIEW_standalone.zip" -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAPVIEW-installer
          path: NAPVIEW_installer.exe
          if-no-files-found: error

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAPVIEW-standalone
          path: NAPVIEW_standalone.zip
          if-no-files-found: error

      - name: Validate release mode ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'release' }}
        run: |
          if (-not "${{ github.ref }}".StartsWith("refs/tags/v")) {
            throw "Release mode requires a v* tag ref. Select a tag in workflow_dispatch."
          }

      - name: Create GitHub release with both binaries
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NAPVIEW_installer.exe
            NAPVIEW_standalone.zip

  build-python-package:
    name: Build Python package / optional TestPyPI publish
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      SHOULD_PUBLISH_TESTPYPI: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.publish_testpypi == 'true')) }}
      TESTPYPI_BASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.testpypi_version || '0.1.1rc1' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Compute next TestPyPI rc version
        id: testpypi_version
        if: ${{ env.SHOULD_PUBLISH_TESTPYPI == 'true' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          base_input = os.environ["TESTPYPI_BASE_VERSION"].strip()
          match = re.fullmatch(r"(\d+\.\d+\.\d+)(?:rc\d+)?", base_input)
          if not match:
              raise SystemExit(f"Invalid TestPyPI base version: {base_input!r}")

          base_version = match.group(1)
          pattern = re.compile(rf"^{re.escape(base_version)}rc(\d+)$")
          releases: dict[str, object] = {}

          try:
              with urllib.request.urlopen("https://test.pypi.org/pypi/napview/json", timeout=20) as response:
                  payload = json.load(response)
              releases = payload.get("releases", {})
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          max_rc = 0
          for version in releases.keys():
              version_match = pattern.fullmatch(version)
              if version_match:
                  rc_number = int(version_match.group(1))
                  if rc_number > max_rc:
                      max_rc = rc_number

          next_version = f"{base_version}rc{max_rc + 1}"
          pyproject_path = Path("pyproject.toml")
          original_text = pyproject_path.read_text(encoding="utf-8")
          updated_text, replacements = re.subn(
              r'^version = ".*"$',
              f'version = "{next_version}"',
              original_text,
              count=1,
              flags=re.MULTILINE,
          )
          if replacements != 1:
              raise SystemExit("Could not update version field in pyproject.toml")
          pyproject_path.write_text(updated_text, encoding="utf-8")
          print(f"Selected TestPyPI version: {next_version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"version={next_version}\n")
          PY
          grep '^version = ' pyproject.toml

      - name: Build package
        run: python -m build

      - name: Upload Python dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: napview-python-dist
          path: dist/*
          if-no-files-found: error

      - name: Publish to TestPyPI
        if: ${{ env.SHOULD_PUBLISH_TESTPYPI == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
