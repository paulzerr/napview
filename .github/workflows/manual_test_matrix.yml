name: Manual Napview Matrix Test

on:
  workflow_dispatch:

jobs:
  matrix-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run install + startup smoke test
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import os
          import subprocess
          import sys
          import threading
          import time
          from pathlib import Path

          artifacts_dir = Path("matrix-artifacts")
          artifacts_dir.mkdir(exist_ok=True)

          os_name = os.environ["RUNNER_OS"]
          py_ver = f"{sys.version_info.major}.{sys.version_info.minor}"
          stamp = dt.datetime.utcnow().strftime("%Y%m%dT%H%M%SZ")
          stem = f"{os_name}_py{py_ver}_{stamp}"

          report_log = artifacts_dir / f"{stem}.log"
          report_csv = artifacts_dir / f"{stem}.csv"
          pip_log = artifacts_dir / f"{stem}_pip.log"
          start_log = artifacts_dir / f"{stem}_start.log"

          def run_cmd(cmd, out_path):
              proc = subprocess.run(cmd, capture_output=True, text=True)
              text = (proc.stdout or "") + (proc.stderr or "")
              out_path.write_text(text, encoding="utf-8")
              return proc.returncode

          venv_dir = Path(".matrix-venv")
          venv_rc = subprocess.run([sys.executable, "-m", "venv", str(venv_dir)]).returncode
          if venv_rc != 0:
              report_log.write_text(
                  "\n".join(
                      [
                          f"Server started at: {dt.datetime.utcnow().isoformat(timespec='seconds')}Z",
                          f"Runner OS: {os_name}",
                          f"Python: {py_ver}",
                          "venv setup: FAIL",
                      ]
                  )
                  + "\n",
                  encoding="utf-8",
              )
              with report_csv.open("w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(
                      f,
                      fieldnames=[
                          "timestamp_utc",
                          "runner_os",
                          "python_version",
                          "pip_install_status",
                          "pip_install_exit_code",
                          "napview_start_status",
                          "napview_exit_code",
                          "line_1",
                          "line_2",
                          "line_3",
                          "line_4",
                          "line_5",
                      ],
                  )
                  writer.writeheader()
                  writer.writerow(
                      {
                          "timestamp_utc": dt.datetime.utcnow().isoformat(timespec="seconds") + "Z",
                          "runner_os": os_name,
                          "python_version": py_ver,
                          "pip_install_status": "FAIL",
                          "pip_install_exit_code": "venv_failed",
                          "napview_start_status": "SKIPPED",
                          "napview_exit_code": "",
                          "line_1": "(venv creation failed)",
                          "line_2": "",
                          "line_3": "",
                          "line_4": "",
                          "line_5": "",
                      }
                  )
              sys.exit(1)

          if os_name == "Windows":
              venv_python = venv_dir / "Scripts" / "python.exe"
              napview_cmd = [str(venv_dir / "Scripts" / "napview.exe")]
          else:
              venv_python = venv_dir / "bin" / "python"
              napview_cmd = [str(venv_dir / "bin" / "napview")]

          _ = run_cmd([str(venv_python), "-m", "pip", "install", "--upgrade", "pip"], artifacts_dir / f"{stem}_pip_upgrade.log")
          pip_rc = run_cmd([str(venv_python), "-m", "pip", "install", "."], pip_log)
          pip_status = "PASS" if pip_rc == 0 else "FAIL"

          first_lines = []
          start_status = "SKIPPED"
          start_rc = ""

          if pip_rc == 0:
              proc = subprocess.Popen(
                  napview_cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  bufsize=1,
              )

              def read_lines():
                  if proc.stdout is None:
                      return
                  for line in proc.stdout:
                      if len(first_lines) < 5:
                          first_lines.append(line.rstrip("\n"))

              t = threading.Thread(target=read_lines, daemon=True)
              t.start()
              deadline = time.time() + 30
              while time.time() < deadline and len(first_lines) < 5 and proc.poll() is None:
                  time.sleep(0.2)

              if proc.poll() is None:
                  start_status = "PASS"
              else:
                  start_rc = str(proc.returncode)
                  start_status = "PASS" if proc.returncode == 0 else "FAIL"

              if not first_lines:
                  first_lines.append("(no terminal output captured in first 30 seconds)")

              start_log.write_text("\n".join(first_lines) + "\n", encoding="utf-8")
          else:
              start_log.write_text("Skipped because pip install failed.\n", encoding="utf-8")
              first_lines = ["(startup skipped)"]

          now = dt.datetime.utcnow().isoformat(timespec="seconds") + "Z"
          lines_block = "\n".join(f"{idx+1}. {line}" for idx, line in enumerate(first_lines[:5]))

          report_log.write_text(
              "\n".join(
                  [
                      f"Server started at: {now}",
                      f"Runner OS: {os_name}",
                      f"Python: {py_ver}",
                      f"pip install: {pip_status} (exit={pip_rc})",
                      f"napview startup: {start_status}" + (f" (exit={start_rc})" if start_rc else ""),
                      "",
                      "First 5 terminal output lines from napview:",
                      lines_block,
                      "",
                      f"pip log: {pip_log.name}",
                      f"startup log: {start_log.name}",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )

          with report_csv.open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=[
                      "timestamp_utc",
                      "runner_os",
                      "python_version",
                      "pip_install_status",
                      "pip_install_exit_code",
                      "napview_start_status",
                      "napview_exit_code",
                      "line_1",
                      "line_2",
                      "line_3",
                      "line_4",
                      "line_5",
                  ],
              )
              writer.writeheader()
              writer.writerow(
                  {
                      "timestamp_utc": now,
                      "runner_os": os_name,
                      "python_version": py_ver,
                      "pip_install_status": pip_status,
                      "pip_install_exit_code": str(pip_rc),
                      "napview_start_status": start_status,
                      "napview_exit_code": start_rc,
                      "line_1": first_lines[0] if len(first_lines) > 0 else "",
                      "line_2": first_lines[1] if len(first_lines) > 1 else "",
                      "line_3": first_lines[2] if len(first_lines) > 2 else "",
                      "line_4": first_lines[3] if len(first_lines) > 3 else "",
                      "line_5": first_lines[4] if len(first_lines) > 4 else "",
                  }
              )

          if pip_rc != 0 or start_status == "FAIL":
              sys.exit(1)
          PY

      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: napview-matrix-${{ matrix.os }}-py${{ matrix.python-version }}
          path: matrix-artifacts
