name: NAPVIEW Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 999
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Python venv
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: venv
          key: ${{ runner.os }}-venv-v1${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Setup Python Environment and Install Dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          .\venv\Scripts\activate
          python -m pip install --upgrade pip "setuptools<70.0.0" wheel
          pip install pyinstaller toml
          pip install .

      - name: Cache NIDRA models
        uses: actions/cache@v4
        id: cache-nidra-models
        with:
          path: nidra/nidra/NIDRA/models
          key: ${{ runner.os }}-nidra-models-v1

      - name: Download NIDRA models
        if: steps.cache-nidra-models.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path nidra/nidra/NIDRA/models
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/ez6.onnx -OutFile nidra/nidra/NIDRA/models/ez6.onnx
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/ez6moe.onnx -OutFile nidra/nidra/NIDRA/models/ez6moe.onnx
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/u-sleep-nsrr-2024.onnx -OutFile nidra/nidra/NIDRA/models/u-sleep-nsrr-2024.onnx
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/u-sleep-nsrr-2024_eeg.onnx -OutFile nidra/nidra/NIDRA/models/u-sleep-nsrr-2024_eeg.onnx

      - name: Enforce Setuptools version
        run: |
          .\venv\Scripts\activate
          python -m pip install "setuptools<70.0.0"

      - name: Build Executable with PyInstaller
        run: .\venv\Scripts\python -m PyInstaller NAPVIEW.spec

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create Self-Extracting Archive
        run: |
          @"
          ;!@Install@!UTF-8!
          Title="NAPVIEW Installer"
          BeginPrompt="This will install NAPVIEW. Do you want to continue?"
          Progress="yes"
          FinishMessage="Do you want to launch NAPVIEW now?"
          RunProgram="NAPVIEW\NAPVIEW.exe"
          ;!@InstallEnd@!
          "@ | Set-Content -Path sfx_config.txt
          Set-Location -Path dist
          & "C:\Program Files\7-Zip\7z.exe" a ..\NAPVIEW_archive.7z NAPVIEW
          Set-Location -Path ..
          cmd.exe --% /c copy /b "C:\Program Files\7-Zip\7z.sfx" + sfx_config.txt + NAPVIEW_archive.7z NAPVIEW_installer.exe

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: NAPVIEW-windows-installer
          path: NAPVIEW_installer.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NAPVIEW_installer.exe

  publish-testpypi:
    name: Publish package to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
