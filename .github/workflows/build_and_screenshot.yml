name: NAPVIEW Build And Screenshot

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build-and-screenshot:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 999
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Python venv
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: venv
          key: ${{ runner.os }}-venv-v1${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Setup Python Environment and Install Dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          .\venv\Scripts\activate
          python -m pip install --upgrade pip "setuptools<70.0.0" wheel
          pip install pyinstaller toml

      - name: Install project dependencies
        run: |
          .\venv\Scripts\activate
          python -m pip install --upgrade pip "setuptools<70.0.0"
          pip install pyinstaller toml
          pip install .

      - name: Install Playwright
        run: |
          .\venv\Scripts\activate
          pip install playwright
          python -m playwright install chromium firefox msedge

      - name: Cache NIDRA models
        uses: actions/cache@v4
        id: cache-nidra-models
        with:
          path: nidra/nidra/NIDRA/models
          key: ${{ runner.os }}-nidra-models-v1

      - name: Download NIDRA models
        if: steps.cache-nidra-models.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path nidra/nidra/NIDRA/models
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/ez6.onnx -OutFile nidra/nidra/NIDRA/models/ez6.onnx
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/ez6moe.onnx -OutFile nidra/nidra/NIDRA/models/ez6moe.onnx
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/u-sleep-nsrr-2024.onnx -OutFile nidra/nidra/NIDRA/models/u-sleep-nsrr-2024.onnx
          Invoke-WebRequest -Uri https://huggingface.co/pzerr/NIDRA_models/resolve/main/u-sleep-nsrr-2024_eeg.onnx -OutFile nidra/nidra/NIDRA/models/u-sleep-nsrr-2024_eeg.onnx

      - name: Enforce Setuptools version
        run: |
          .\venv\Scripts\activate
          python -m pip install "setuptools<70.0.0"

      - name: Build Executable with PyInstaller
        run: .\venv\Scripts\python -m PyInstaller NAPVIEW.spec

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create Self-Extracting Archive
        run: |
          @"
          ;!@Install@!UTF-8!
          Title="NAPVIEW Installer"
          BeginPrompt="This will install NAPVIEW. Do you want to continue?"
          InstallPath="$pwd\NAPVIEW_install"
          Progress="yes"
          FinishMessage="Do you want to launch NAPVIEW now?"
          RunProgram="NAPVIEW.exe"
          ;!@InstallEnd@!
          "@ | Set-Content -Path sfx_config.txt
          Set-Location -Path dist
          & "C:\Program Files\7-Zip\7z.exe" a ..\NAPVIEW_archive.7z .\NAPVIEW\*
          Set-Location -Path ..
          cmd.exe --% /c copy /b "C:\Program Files\7-Zip\7z.sfx" + sfx_config.txt + NAPVIEW_archive.7z NAPVIEW_installer.exe

      - name: Install via installer
        run: |
          Start-Process -FilePath ".\NAPVIEW_installer.exe" -ArgumentList "-y" -Wait

      - name: Launch NAPVIEW
        run: |
          $exePath = "$pwd\\NAPVIEW_install\\NAPVIEW.exe"
          if (-not (Test-Path $exePath)) { throw "NAPVIEW.exe not found at $exePath"; }
          Start-Process -FilePath $exePath -WorkingDirectory "$pwd\\NAPVIEW_install"
          Start-Sleep -Seconds 10

      - name: Capture screenshots
        run: |
          @"
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          URL = "http://127.0.0.1:8145"
          VIEWPORTS = [(1280, 720), (1920, 1080), (375, 812)]
          OUTPUT_DIR = Path("screenshots")
          OUTPUT_DIR.mkdir(exist_ok=True)

          def wait_for_app(page):
              deadline = time.time() + 60
              while time.time() < deadline:
                  try:
                      page.goto(URL, wait_until="domcontentloaded", timeout=5000)
                      page.wait_for_selector("#statusLabel", timeout=5000)
                      return
                  except PlaywrightTimeoutError:
                      time.sleep(2)
              raise RuntimeError("NAPVIEW UI did not load in time")

          with sync_playwright() as p:
              for width, height in VIEWPORTS:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page(viewport={"width": width, "height": height})
                  wait_for_app(page)
                  page.screenshot(path=OUTPUT_DIR / f"chrome_{width}x{height}.png", full_page=True)
                  browser.close()

              for width, height in VIEWPORTS:
                  browser = p.firefox.launch(headless=True)
                  page = browser.new_page(viewport={"width": width, "height": height})
                  wait_for_app(page)
                  page.screenshot(path=OUTPUT_DIR / f"firefox_{width}x{height}.png", full_page=True)
                  browser.close()

              for width, height in VIEWPORTS:
                  try:
                      browser = p.chromium.launch(channel="msedge", headless=True, args=["--no-first-run", "--no-default-browser-check"])
                  except Exception:
                      break
                  page = browser.new_page(viewport={"width": width, "height": height})
                  wait_for_app(page)
                  page.screenshot(path=OUTPUT_DIR / f"edge_{width}x{height}.png", full_page=True)
                  browser.close()
          "@ | Set-Content -Path take_screenshots.py
          .\venv\Scripts\activate
          python take_screenshots.py

      - name: Zip screenshots
        run: |
          Compress-Archive -Path screenshots\* -DestinationPath screenshots.zip

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: napview-screenshots
          path: screenshots.zip
