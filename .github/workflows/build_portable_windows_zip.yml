name: NAPVIEW Build Portable Windows ZIP

on:
  push:
  workflow_dispatch:
    inputs:
      python_runtime_version:
        description: CPython NuGet runtime version (3.11.x recommended)
        required: false
        default: "3.11.9"

jobs:
  build-portable-zip:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    env:
      REPO_ROOT: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build portable ZIP package
        run: |
          Set-Location -Path $env:REPO_ROOT
          $pythonVersion = "${{ github.event.inputs.python_runtime_version }}"
          if ([string]::IsNullOrWhiteSpace($pythonVersion)) { $pythonVersion = "3.11.9" }
          .\ci\windows\build_portable_zip.ps1 -RepoRoot $env:REPO_ROOT -PythonVersion $pythonVersion

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: napview-portable-win64
          path: |
            ${{ github.workspace }}\dist\NAPVIEW_portable_win64.zip
            ${{ github.workspace }}\dist\portable_windows_build\NAPVIEW_portable_win64\README_portable.txt
            ${{ github.workspace }}\dist\portable_windows_build\NAPVIEW_portable_win64\build_info.json
            ${{ github.workspace }}\dist\portable_windows_build\NAPVIEW_portable_win64\requirements.freeze.txt
            ${{ github.workspace }}\dist\portable_windows_build\NAPVIEW_portable_win64\NIDRA_models.sha256.tsv
          if-no-files-found: error
