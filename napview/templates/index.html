    <script>
        document.addEventListener('wheel', function (event) {
            if (event.ctrlKey === true) {
                event.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('keydown', function (event) {
            if (event.ctrlKey === true && (event.key === '+' || event.key === '-' || event.key === '0' || event.key === '_')) {
                event.preventDefault();
            }
        });
    </script>

    <div id="chartWrapper"></div>
    <div class="chart-page">
        <div class="chart-toolbar">

                <input id="zoomSlider" type="range" min="2" max="600" step="1" value="120">

            </div>
            <button id="colorOptionsButton">Colors</button>
        </div>
        <div class="chart-container">
            <div class="chart-block" id="d3Plot1">

                </div>

    <div id="colorDialog" class="dialog-overlay">
        <div class="modal-content color-dialog">
            <h2>Colors</h2>
            <div class="dialog-section">
                <label for="paletteSelect">Palette</label>
                <select id="paletteSelect"></select>
            </div>
            <div class="dialog-section dialog-columns">
                <div>
                    <div class="dialog-subtitle">Sleep staging</div>
                    <div id="chart1ColorList" class="color-grid"></div>
                </div>
                <div>
                    <div class="dialog-subtitle">Band power</div>
                    <div id="chart2ColorList" class="color-grid"></div>
                </div>
            </div>
            <div class="dialog-actions">
                <button id="closeColors">Cancel</button>
                <button id="saveColors">Apply</button>
            </div>
